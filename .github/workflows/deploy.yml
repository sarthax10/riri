# Deploys RiRi to your server over SSH after a push to main (or by hand from the Actions tab).
#
# Off until you opt in: set the repository variable DEPLOY_ENABLED to "true".
# Repository VARIABLES (Settings > Secrets and variables > Actions > Variables):
#   DEPLOY_ENABLED   "true" to deploy on push
#   DEPLOY_HOST      the server's hostname
#   DEPLOY_PORT      SSH port (22, or 443 when SSH shares the HTTPS port through sslh)
#   DEPLOY_USER      the Linux account that owns the checkout
#   DEPLOY_PATH      checkout path on the server, default ~/reliquary
#   DOMAIN, HOST_USER, TZ, MODEL, CTX, THREADS, CACHE_RAM, CADDY_DATA_VOLUME   (written into .env)
# Repository SECRETS (Settings > Secrets and variables > Actions > Secrets):
#   DEPLOY_SSH_KEY       private key of a deploy-only SSH key pair (its .pub goes in the server's authorized_keys)
#   DEPLOY_KNOWN_HOSTS   output of: ssh-keyscan -p <port> <host>
#   WORKBENCH_TOKEN      long random string (openssl rand -hex 32)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set up SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts

      - name: Write .env on the server
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
          USER: ${{ vars.DEPLOY_USER }}
          DIR: ${{ vars.DEPLOY_PATH || '~/reliquary' }}
          WORKBENCH_TOKEN: ${{ secrets.WORKBENCH_TOKEN }}
        run: |
          {
            echo "DOMAIN=${{ vars.DOMAIN }}"
            echo "HOST_USER=${{ vars.HOST_USER }}"
            echo "TZ=${{ vars.TZ || 'Asia/Kolkata' }}"
            echo "MODEL=${{ vars.MODEL || 'gpt-oss-20b-Q4_K_M.gguf' }}"
            echo "CTX=${{ vars.CTX || '32768' }}"
            echo "THREADS=${{ vars.THREADS || '4' }}"
            echo "CACHE_RAM=${{ vars.CACHE_RAM || '0' }}"
            [ -n "${{ vars.CADDY_DATA_VOLUME }}" ] && echo "CADDY_DATA_VOLUME=${{ vars.CADDY_DATA_VOLUME }}"
            echo "WORKBENCH_TOKEN=$WORKBENCH_TOKEN"
          } > env.out
          scp -i ~/.ssh/deploy -P "$PORT" env.out "$USER@$HOST:/tmp/riri.env"
          rm env.out

      - name: Pull and restart
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
          USER: ${{ vars.DEPLOY_USER }}
          DIR: ${{ vars.DEPLOY_PATH || '~/reliquary' }}
          REPO: ${{ github.server_url }}/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy -p "$PORT" "$USER@$HOST" bash -s -- "$DIR" "$REPO" "$SHA" <<'REMOTE'
          set -euo pipefail
          DIR="${1/#\~/$HOME}"; REPO="$2"; SHA="$3"
          mkdir -p "$DIR" && cd "$DIR"
          if [ ! -d .git ]; then git init -q && git remote add origin "$REPO"; fi
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q -f "$SHA"
          install -m 600 /tmp/riri.env .env && rm -f /tmp/riri.env
          docker compose up -d --build --remove-orphans
          sh cli/install.sh >/dev/null
          docker compose ps
          REMOTE

      - name: Clean up
        if: always()
        run: rm -f ~/.ssh/deploy
