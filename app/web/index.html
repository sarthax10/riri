<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>RiRi</title>
<meta name="theme-color" content="#0F1013">
<meta name="color-scheme" content="dark">
<meta name="description" content="RiRi, your private AI on your own server.">
<!-- Installed on an iPhone home screen it runs full screen, like an app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RiRi">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="atmos" aria-hidden="true"></div>
<div id="boot" class="boot"></div>

<div id="login" class="login" hidden>
  <div class="login-card glass">
    <div class="login-ring" id="login-reli"></div>
    <h1 class="login-title">RiRi</h1>
    <p class="login-sub" id="login-sub">Private. On your own machine.</p>
    <form id="login-form" autocomplete="on">
      <label class="field"><span>Password</span>
        <input id="login-pw" type="password" autocomplete="current-password" required></label>
      <label class="field" id="login-code-wrap" hidden><span>Code from your authenticator</span>
        <input id="login-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" maxlength="7"></label>
      <p class="form-error" id="login-error" role="alert"></p>
      <button class="btn btn-accent btn-wide" type="submit">Sign in</button>
    </form>
  </div>
</div>

<div id="app" class="shell" hidden>
  <nav class="rail" aria-label="Sections">
    <a class="rail-logo" href="#/" aria-label="Home" id="brand-reli"></a>
    <div class="rail-group">
      <a class="rail-btn" href="#/" data-nav="home" title="Home"><svg viewBox="0 0 24 24"><path d="M4.5 11 12 4.8l7.5 6.2V19a1 1 0 0 1-1 1H15v-5H9v5H5.5a1 1 0 0 1-1-1z"/></svg><span class="tip">Home</span></a>
      <a class="rail-btn only-phone" href="#/chats" data-nav="chats" title="Chats"><svg viewBox="0 0 24 24"><path d="M5 6.5A1.5 1.5 0 0 1 6.5 5h11A1.5 1.5 0 0 1 19 6.5v8a1.5 1.5 0 0 1-1.5 1.5H10l-4 3.5V16h0a1 1 0 0 1-1-1z"/></svg><span class="tip">Chats</span><b class="run-badge" hidden></b></a>
      <a class="rail-btn" href="#/fs" data-nav="files" title="Files"><svg viewBox="0 0 24 24"><path d="M3.5 7a2 2 0 0 1 2-2H10l2 2.5h6.5a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg><span class="tip">Files</span></a>
      <a class="rail-btn" href="#/live" data-nav="live" title="Live"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/></svg><span class="tip">Live</span><b class="live-badge" hidden></b></a>
      <a class="rail-btn" href="#/server" data-nav="server" title="Server"><svg viewBox="0 0 24 24"><path d="M4.5 16.5a8 8 0 1 1 15 0"/><path d="m12 13 3.5-4"/><circle cx="12" cy="13" r="1.2"/></svg><span class="tip">Server</span></a>
      <a class="rail-btn" href="#/tasks" data-nav="tasks" title="Tasks"><svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="4"/><path d="m8.5 12.2 2.4 2.4 4.6-4.8"/></svg><span class="tip">Tasks</span></a>
      <a class="rail-btn" href="#/notes" data-nav="notes" title="Notes"><svg viewBox="0 0 24 24"><path d="M7 4.5h7.5L18 8v11.5H7z"/><path d="M9.5 11h6M9.5 14.5h6"/></svg><span class="tip">Notes</span></a>
      <a class="rail-btn" href="#/memory" data-nav="memory" title="Memory"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.5"/></svg><span class="tip">Memory</span></a>
      <button class="rail-btn only-phone" id="open-more" data-nav="more" title="More" type="button"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg><span class="tip">More</span></button>
    </div>
    <span class="rail-word" aria-hidden="true">riri</span>
    <div class="rail-group rail-bottom">
      <button class="rail-btn" id="open-search" title="Search (Ctrl K)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m15.5 15.5 4 4"/></svg><span class="tip">Search</span></button>
      <button class="rail-btn" id="open-settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.8"/><path d="M12 3.5v2.3M12 18.2v2.3M4.6 7.7l2 1.2M17.4 15.1l2 1.2M4.6 16.3l2-1.2M17.4 8.9l2-1.2"/></svg><span class="tip">Settings</span></button>
    </div>
  </nav>

  <aside class="side glass" id="left">
    <div class="side-head">
      <h2 class="side-title">Conversations</h2>
      <button class="icon-btn" id="new-chat" aria-label="New chat" title="New chat"><svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg></button>
    </div>
    <div class="seg" role="tablist" id="filter">
      <button role="tab" data-f="all" aria-selected="true">All</button>
      <button role="tab" data-f="chat">Chats</button>
      <button role="tab" data-f="agent">Code</button>
    </div>
    <div class="session-list" id="session-list"></div>
    <div class="side-foot">
      <h3 class="side-sub">Folders</h3>
      <div class="ws-list" id="ws-list"></div>
    </div>
  </aside>

  <main class="stage" id="stage"></main>

  <aside class="log glass" id="log">
    <section class="log-live">
      <div class="log-head"><div><h3 id="log-title">RiRi</h3><span class="log-state" id="log-state"></span></div><div id="log-reli" class="log-ring"></div></div>
      <ol class="feed" id="feed"></ol>
    </section>
    <section class="today" id="today"></section>
    <section class="machine" id="machine"></section>
  </aside>

  <!-- inside the shell: on phones the shell is position:fixed (its own stacking layer), so the dimmer must live
       in the same layer as the drawers, below them -->
  <div class="scrim" id="scrim" hidden></div>
  <header class="mobile-bar">
    <button class="icon-btn" id="open-left" aria-label="Conversations"><svg viewBox="0 0 24 24"><path d="M4.5 7.5h15M4.5 12h15M4.5 16.5h9"/></svg></button>
    <span class="mobile-title">RiRi</span>
    <button class="speed-pill" id="speed-pill" title="Model status"></button>
    <button class="icon-btn only-phone" id="open-search-m" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m15.5 15.5 4 4"/></svg></button>
    <button class="icon-btn only-phone" id="open-settings-m" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.8"/><path d="M12 3.5v2.3M12 18.2v2.3M4.6 7.7l2 1.2M17.4 15.1l2 1.2M4.6 16.3l2-1.2M17.4 8.9l2-1.2"/></svg></button>
    <button class="icon-btn" id="open-log" aria-label="Activity"><svg viewBox="0 0 24 24"><path d="M4 12h3.5l2-5 4 10 2-5H20"/></svg></button>
  </header>
</div>

<dialog class="modal glass" id="modal"></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script src="/vendor/qrcode.js"></script>
<script src="/vendor/katex/katex.min.js" defer></script>
<script src="/icons.js"></script>
<script src="/media.js"></script>
<script src="/server.js"></script>
<script src="/reli.js"></script>
<script src="/app.js"></script>
</body>
</html>
